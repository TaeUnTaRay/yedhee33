<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนใบหน้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://justadudewhohacks.github.io">
  <script src="js/api-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1b2a 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
      position: relative;
    }

    /* Ambient orb */
    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: #6366f1;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      top: -80px; left: -80px;
      pointer-events: none; z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 520px;
      position: relative; z-index: 1;
      animation: fadeIn 0.5s ease;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #64748b; text-decoration: none; font-size: 0.88em;
      padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.25s ease;
      margin-bottom: 16px;
    }
    .back-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.1); }

    h2 {
      font-size: 1.6em; font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .instruction {
      font-size: 0.83em; color: #64748b; line-height: 1.6;
    }

    /* Step dots */
    .step-dots {
      display: flex; justify-content: center; gap: 10px;
      margin: 16px 0 20px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: #6366f1;
      box-shadow: 0 0 10px rgba(99,102,241,0.6);
    }

    /* Status */
    #status {
      font-size: 0.88em; color: #64748b;
      margin-bottom: 14px; min-height: 20px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(99,102,241,0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Video */
    .video-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(99,102,241,0.4);
      box-shadow: 0 0 30px rgba(99,102,241,0.2), inset 0 0 30px rgba(0,0,0,0.3);
      background: #0a0a1a;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    video {
      width: 100%; display: block;
      transform: scaleX(-1);
      border-radius: 18px;
    }

    /* Form Section */
    .form-section {
      margin-top: 22px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 22px 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 15px;
      font-family: 'Sarabun', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }
    .input-group input::placeholder { color: #475569; }
    .input-group input:focus {
      border-color: rgba(99,102,241,0.6);
      background: rgba(99,102,241,0.06);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    #btnSave {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }
    #btnSave:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99,102,241,0.5);
    }
    #btnSave:disabled {
      background: rgba(255,255,255,0.1);
      color: #475569;
      box-shadow: none;
      cursor: default;
    }

    .count-badge {
      background: rgba(255,255,255,0.2);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    #btnSave:not(:disabled) .count-badge {
      background: rgba(255,255,255,0.25);
    }

    #msg {
      margin-top: 14px; min-height: 24px;
      font-size: 0.9em; font-weight: 600;
      text-align: center;
    }
    .msg-success { color: #34d399; }
    .msg-error   { color: #f87171; }

    #btnReset {
      display: none; margin: 12px auto 0; background: none; border: none;
      color: #64748b; font-family: inherit; font-size: 0.85em; cursor: pointer; text-decoration: underline;
    }
    .input-group input:disabled { opacity: 0.6; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <a href="index.html" class="back-btn">← กลับ</a>
    <h2>👤 ลงทะเบียนใบหน้า</h2>
    <p class="instruction">ถ่าย 3 มุม: หน้าตรง / หันซ้ายเล็กน้อย / หันขวาเล็กน้อย<br>ระบบจะบันทึกให้ครั้งเดียวเมื่อถ่ายครบ</p>
  </div>

  <div class="step-dots">
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>

  <div id="status">
    <span class="spinner"></span> กำลังโหลด AI Model...
  </div>

  <div class="video-wrapper">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div class="form-section">
    <div class="input-group">
      <input type="text" id="username" placeholder="ชื่อ-นามสกุลพนักงาน">
    </div>

    <button id="btnSave" onclick="onMainClick()" disabled>
      📸 ถ่ายมุมที่ 1 <span id="saveCount" class="count-badge">0</span>
    </button>
    <button id="btnReset" onclick="resetCaptures()">ล้างและถ่ายใหม่</button>

    <div id="msg"></div>
  </div>
</div>

<script>
  const API_URL   = localStorage.getItem('gasApiUrl') || GAS_API_URL;
  const video     = document.getElementById('video');
  const statusDiv = document.getElementById('status');
  const btnSave   = document.getElementById('btnSave');
  const btnReset  = document.getElementById('btnReset');
  const nameInput = document.getElementById('username');
  const msgDiv    = document.getElementById('msg');

  // โมเดลจาก CDN (แคชในเบราว์เซอร์ได้ยาวกว่า) ถ้าโหลดไม่ได้ ลองแหล่งสำรอง
  const MODEL_SOURCES = [
    'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights',
    'https://justadudewhohacks.github.io/face-api.js/models'
  ];
  const STEPS = ['หน้าตรง', 'หันซ้ายเล็กน้อย', 'หันขวาเล็กน้อย'];
  const TOTAL = STEPS.length;

  let descriptors = [];   // เก็บในเครื่องก่อน แล้วส่งครั้งเดียวตอนครบ
  let modelsReady = false, cameraReady = false, busy = false, failedUpload = false;

  if (!API_URL) {
    statusDiv.innerHTML = '<span style="color:#f87171">❌ ยังไม่ได้ตั้งค่า API URL — <a href="config.html" style="color:#fbbf24">ไปตั้งค่า</a></span>';
  } else {
    // เริ่มเปิดกล้องและโหลดโมเดลพร้อมกัน (ไม่รอกัน)
    window.addEventListener('load', () => { startCamera(); loadModels(); });
  }

  function setStatus(html) { statusDiv.innerHTML = html; }
  function showMsg(html) { msgDiv.innerHTML = html; }

  function refreshUI() {
    [1, 2, 3].forEach(i => {
      document.getElementById('dot' + i).className = 'dot' + (i <= descriptors.length ? ' active' : '');
    });
    const n = descriptors.length;
    const ready = modelsReady && cameraReady && !busy;
    btnSave.disabled = !ready;
    if (failedUpload) btnSave.innerHTML = '🔁 ส่งอีกครั้ง <span class="count-badge">' + n + '</span>';
    else if (busy) { /* keep current label */ }
    else btnSave.innerHTML = '📸 ถ่ายมุมที่ ' + Math.min(n + 1, TOTAL) + ' (' + STEPS[Math.min(n, TOTAL - 1)] + ') <span class="count-badge">' + n + '</span>';
    nameInput.disabled = n > 0 || busy;
    btnReset.style.display = (n > 0 && !busy) ? 'block' : 'none';

    if (modelsReady && cameraReady && !busy && n === 0) setStatus('');
  }

  async function loadModels() {
    setStatus('<span class="spinner"></span> กำลังโหลด AI Model (ครั้งแรกอาจใช้เวลาสักครู่ ครั้งต่อไปจะเร็วขึ้น)...');
    let lastErr = null;
    for (const base of MODEL_SOURCES) {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(base),   // เล็กกว่า ssdMobilenet มาก
          faceapi.nets.faceLandmark68Net.loadFromUri(base),
          faceapi.nets.faceRecognitionNet.loadFromUri(base)
        ]);
        modelsReady = true;
        refreshUI();
        return;
      } catch (e) { lastErr = e; }
    }
    setStatus('<span style="color:#f87171">❌ โหลด AI Model ล้มเหลว: ' + (lastErr ? lastErr.message : '') + '</span>');
  }

  function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
      .then(stream => {
        video.srcObject = stream;
        cameraReady = true;
        refreshUI();
      })
      .catch(err => {
        setStatus('<span style="color:#f87171">❌ เปิดกล้องไม่ได้: ' + err.message + '</span>');
      });
  }

  function resetCaptures() {
    descriptors = [];
    failedUpload = false;
    showMsg('');
    refreshUI();
  }

  function onMainClick() {
    if (failedUpload) return uploadAll();
    return capture();
  }

  async function capture() {
    const name = nameInput.value.trim();
    if (!name) return alert('กรุณาใส่ชื่อก่อน');

    busy = true;
    btnSave.disabled = true;
    btnSave.innerHTML = '⏳ กำลังตรวจจับใบหน้า...';
    showMsg('');

    let detection = null;
    try {
      detection = await faceapi
        .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
        .withFaceLandmarks()
        .withFaceDescriptor();
    } catch (e) { console.error(e); }

    busy = false;
    if (!detection) {
      showMsg('<span class="msg-error">ไม่พบใบหน้า! กรุณามองกล้องให้ชัดเจนแล้วลองอีกครั้ง</span>');
      return refreshUI();
    }

    // ปัดทศนิยมเพื่อลดขนาดข้อมูลที่ส่ง (ไม่กระทบความแม่นยำ)
    descriptors.push(Array.from(detection.descriptor, x => +x.toFixed(5)));
    refreshUI();

    if (descriptors.length >= TOTAL) {
      uploadAll();
    } else {
      showMsg('<span class="msg-success">✅ ถ่ายมุมที่ ' + descriptors.length + ' แล้ว — ต่อไป: ' + STEPS[descriptors.length] + '</span>');
    }
  }

  async function uploadAll() {
    const name = nameInput.value.trim();
    busy = true;
    failedUpload = false;
    btnSave.disabled = true;
    btnSave.innerHTML = '⏳ กำลังบันทึก...';
    nameInput.disabled = true;
    btnReset.style.display = 'none';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'registerUser', name, faceDescriptors: descriptors })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      busy = false;
      showMsg('<span class="msg-success">✅ ลงทะเบียน "' + name.replace(/[<>&]/g, '') + '" สำเร็จ (' + descriptors.length + ' มุม)</span>');
      // เตรียมลงทะเบียนคนถัดไป (ค้างจุดไว้ให้เห็นครู่หนึ่ง)
      setTimeout(() => {
        descriptors = [];
        nameInput.value = '';
        refreshUI();
      }, 2500);
      btnSave.innerHTML = '✅ บันทึกแล้ว';
    } catch (e) {
      busy = false;
      failedUpload = true;
      showMsg('<span class="msg-error">❌ บันทึกล้มเหลว: ' + e.message + ' (ข้อมูลที่ถ่ายยังอยู่ กด "ส่งอีกครั้ง")</span>');
      refreshUI();
    }
  }
</script>
</body>
</html>
