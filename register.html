<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนใบหน้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://justadudewhohacks.github.io">
  <script src="js/api-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1b2a 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
      position: relative;
    }

    /* Ambient orb */
    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: #6366f1;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.12;
      top: -80px; left: -80px;
      pointer-events: none; z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 520px;
      position: relative; z-index: 1;
      animation: fadeIn 0.5s ease;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #64748b; text-decoration: none; font-size: 0.88em;
      padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.25s ease;
      margin-bottom: 16px;
    }
    .back-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.1); }

    h2 {
      font-size: 1.6em; font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .instruction {
      font-size: 0.83em; color: #64748b; line-height: 1.6;
    }

    /* Step dots */
    .step-dots {
      display: flex; justify-content: center; gap: 10px;
      margin: 16px 0 20px;
    }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: #6366f1;
      box-shadow: 0 0 10px rgba(99,102,241,0.6);
    }

    /* Status */
    #status {
      font-size: 0.88em; color: #64748b;
      margin-bottom: 14px; min-height: 20px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(99,102,241,0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Video */
    .video-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(99,102,241,0.4);
      box-shadow: 0 0 30px rgba(99,102,241,0.2), inset 0 0 30px rgba(0,0,0,0.3);
      background: #0a0a1a;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    video {
      width: 100%; display: block;
      transform: scaleX(-1);
      border-radius: 18px;
    }

    /* Form Section */
    .form-section {
      margin-top: 22px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 22px 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 15px;
      font-family: 'Sarabun', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }
    .input-group input::placeholder { color: #475569; }
    .input-group input:focus {
      border-color: rgba(99,102,241,0.6);
      background: rgba(99,102,241,0.06);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    #btnSave {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }
    #btnSave:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(99,102,241,0.5);
    }
    #btnSave:disabled {
      background: rgba(255,255,255,0.1);
      color: #475569;
      box-shadow: none;
      cursor: default;
    }

    .count-badge {
      background: rgba(255,255,255,0.2);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    #btnSave:not(:disabled) .count-badge {
      background: rgba(255,255,255,0.25);
    }

    #msg {
      margin-top: 14px; min-height: 24px;
      font-size: 0.9em; font-weight: 600;
      text-align: center;
    }
    .msg-success { color: #34d399; }
    .msg-error   { color: #f87171; }

    /* ===== Face guide overlay ===== */
    .guide { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; border-radius: 18px; }
    .face-oval {
      position: absolute; left: 50%; top: 50%;
      width: 56%; aspect-ratio: 3 / 4; max-height: 86%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3px dashed rgba(255,255,255,0.75);
      box-shadow: 0 0 0 999px rgba(10,10,26,0.50);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .guide.scanning .face-oval { animation: pulse 1.6s ease-in-out infinite; }
    .guide.adjust .face-oval { border-color: #fbbf24; border-style: dashed; }
    .guide.ok .face-oval { border-color: #34d399; border-style: solid; box-shadow: 0 0 0 999px rgba(10,10,26,0.50), 0 0 24px rgba(52,211,153,0.6); animation: none; }
    .guide.none .face-oval { border-color: #f87171; }
    .guide.done .face-oval { border-color: #34d399; border-style: solid; }
    .corner { position: absolute; width: 26px; height: 26px; border: 0 solid #a5b4fc; opacity: 0.9; }
    .c-tl { top: 12px; left: 12px; border-top-width: 3px; border-left-width: 3px; border-radius: 6px 0 0 0; }
    .c-tr { top: 12px; right: 12px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 6px 0 0; }
    .c-bl { bottom: 12px; left: 12px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 6px; }
    .c-br { bottom: 12px; right: 12px; border-bottom-width: 3px; border-right-width: 3px; border-radius: 0 0 6px 0; }
    .guide.ok .corner { border-color: #34d399; }
    .arrow {
      display: none; position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 34px; color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.7);
      animation: nudge 0.9s ease-in-out infinite;
    }
    .arrow-left { left: 6%; } .arrow-right { right: 6%; }
    .arrow-right { animation-name: nudgeR; }
    .guide-badge {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.68); backdrop-filter: blur(8px);
      color: #f1f5f9; padding: 8px 18px; border-radius: 30px;
      font-size: 0.92em; font-weight: 600; white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.12); max-width: 92%;
    }
    .guide.ok .guide-badge { background: rgba(5,150,105,0.8); }
    .guide.none .guide-badge { background: rgba(185,28,28,0.75); }
    .step-chip {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(99,102,241,0.8); color: #fff; padding: 4px 14px; border-radius: 20px;
      font-size: 0.8em; font-weight: 600; display: none;
    }
    .guide.scanning .step-chip { display: block; }
    .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
    .flash.go { animation: flashAnim 0.35s ease-out; }
    @keyframes pulse { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.02); } }
    @keyframes nudge { 0%,100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(-8px); } }
    @keyframes nudgeR { 0%,100% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(8px); } }
    @keyframes flashAnim { 0% { opacity: 0.85; } 100% { opacity: 0; } }

    #btnReset {
      display: none; margin: 12px auto 0; background: none; border: none;
      color: #64748b; font-family: inherit; font-size: 0.85em; cursor: pointer; text-decoration: underline;
    }
    .input-group input:disabled { opacity: 0.6; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <a href="index.html" class="back-btn">← กลับ</a>
    <h2>👤 ลงทะเบียนใบหน้า</h2>
    <p class="instruction">กด "เริ่มสแกน" ครั้งเดียว ระบบจะถ่ายให้อัตโนมัติ 3 มุม<br>หน้าตรง → หันซ้ายเล็กน้อย → หันขวาเล็กน้อย แล้วบันทึกให้เอง</p>
  </div>

  <div class="step-dots">
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>

  <div id="status">
    <span class="spinner"></span> กำลังโหลด AI Model...
  </div>

  <div class="video-wrapper">
    <video id="video" autoplay muted playsinline></video>

    <!-- กรอบนำทางใบหน้า -->
    <div class="guide" id="guide">
      <div class="face-oval" id="faceOval"></div>
      <div class="corner c-tl"></div><div class="corner c-tr"></div>
      <div class="corner c-bl"></div><div class="corner c-br"></div>
      <div class="arrow arrow-left" id="arrowLeft">◀</div>
      <div class="arrow arrow-right" id="arrowRight">▶</div>
      <div class="guide-badge" id="guideBadge">พร้อมสแกน</div>
      <div class="step-chip" id="stepChip"></div>
      <div class="flash" id="flash"></div>
    </div>
  </div>

  <div class="form-section">
    <div class="input-group">
      <input type="text" id="username" placeholder="ชื่อ-นามสกุลพนักงาน">
    </div>

    <button id="btnSave" onclick="onMainClick()" disabled>
      🎬 เริ่มสแกน (3 มุมอัตโนมัติ) <span id="saveCount" class="count-badge">0</span>
    </button>
    <button id="btnReset" onclick="resetCaptures()">ยกเลิก / ล้างและเริ่มใหม่</button>

    <div id="msg"></div>
  </div>
</div>

<script>
  const API_URL   = localStorage.getItem('gasApiUrl') || GAS_API_URL;
  const video     = document.getElementById('video');
  const statusDiv = document.getElementById('status');
  const btnSave   = document.getElementById('btnSave');
  const btnReset  = document.getElementById('btnReset');
  const nameInput = document.getElementById('username');
  const msgDiv    = document.getElementById('msg');
  const guide     = document.getElementById('guide');
  const guideBadge = document.getElementById('guideBadge');
  const stepChip  = document.getElementById('stepChip');
  const arrowL    = document.getElementById('arrowLeft');
  const arrowR    = document.getElementById('arrowRight');

  // โมเดลจาก CDN (แคชในเบราว์เซอร์ได้ยาวกว่า) ถ้าโหลดไม่ได้ ลองแหล่งสำรอง
  const MODEL_SOURCES = [
    'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights',
    'https://justadudewhohacks.github.io/face-api.js/models'
  ];

  // yaw = ตำแหน่งปลายจมูกเทียบกึ่งกลางกรามเป็นสัดส่วนความกว้างหน้า
  // (ภาพดิบจากกล้อง: หันไปทางซ้ายของผู้ใช้ => yaw > 0)
  const STEPS = [
    { label: 'หน้าตรง',        hint: 'มองตรงที่กล้อง',                 arrow: '',      ok: y => Math.abs(y) < 0.10 },
    { label: 'หันซ้ายเล็กน้อย', hint: 'ค่อยๆ หันหน้าไปทางซ้ายเล็กน้อย',  arrow: 'left',  ok: y => y > 0.10 && y < 0.45 },
    { label: 'หันขวาเล็กน้อย', hint: 'ค่อยๆ หันหน้าไปทางขวาเล็กน้อย',  arrow: 'right', ok: y => y < -0.10 && y > -0.45 }
  ];
  const TOTAL = STEPS.length;
  const STEP_TIMEOUT_MS = 10000;   // ถ้าท่าไม่ตรงนานเกินนี้ ถ่ายตามที่เห็นเพื่อไม่ให้ค้าง
  const STABLE_FRAMES = 3;         // ต้องนิ่งในท่าที่ถูกต้องกี่เฟรมก่อนถ่าย

  let descriptors = [];
  let modelsReady = false, cameraReady = false, busy = false, failedUpload = false;
  let runId = 0;                   // ใช้ยกเลิกรอบสแกนที่กำลังทำงาน

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const detectorOpts = () => new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });

  if (!API_URL) {
    statusDiv.innerHTML = '<span style="color:#f87171">❌ ยังไม่ได้ตั้งค่า API URL — <a href="config.html" style="color:#fbbf24">ไปตั้งค่า</a></span>';
  } else {
    window.addEventListener('load', () => { startCamera(); loadModels(); });
  }

  function setStatus(html) { statusDiv.innerHTML = html; }
  function showMsg(html) { msgDiv.innerHTML = html; }

  function yawOf(p) {
    const width = p[16].x - p[0].x;
    if (!width) return 0;
    return (p[30].x - (p[0].x + p[16].x) / 2) / width;
  }

  // ----- guide overlay -----
  function setGuide(state, badge) {
    guide.classList.remove('adjust', 'ok', 'none', 'done');
    if (state) guide.classList.add(state);
    if (badge !== undefined) guideBadge.textContent = badge;
  }
  function showArrow(dir) {
    arrowL.style.display = dir === 'left' ? 'block' : 'none';
    arrowR.style.display = dir === 'right' ? 'block' : 'none';
  }
  function doFlash() {
    const f = document.getElementById('flash');
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  }

  function refreshUI() {
    [1, 2, 3].forEach(i => {
      document.getElementById('dot' + i).className = 'dot' + (i <= descriptors.length ? ' active' : '');
    });
    const n = descriptors.length;
    const ready = modelsReady && cameraReady && !busy;
    btnSave.disabled = !ready;
    if (failedUpload) btnSave.innerHTML = '🔁 ส่งอีกครั้ง <span class="count-badge">' + n + '</span>';
    else if (!busy) btnSave.innerHTML = '🎬 เริ่มสแกน (3 มุมอัตโนมัติ) <span class="count-badge">' + n + '</span>';
    nameInput.disabled = busy || failedUpload;
    btnReset.style.display = (busy || n > 0 || failedUpload) ? 'block' : 'none';
    if (modelsReady && cameraReady && !busy && n === 0) setStatus('');
  }

  async function loadModels() {
    setStatus('<span class="spinner"></span> กำลังโหลด AI Model (ครั้งแรกอาจใช้เวลาสักครู่ ครั้งต่อไปจะเร็วขึ้น)...');
    let lastErr = null;
    for (const base of MODEL_SOURCES) {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(base),
          faceapi.nets.faceLandmark68Net.loadFromUri(base),
          faceapi.nets.faceRecognitionNet.loadFromUri(base)
        ]);
        modelsReady = true;
        setGuide('', 'พร้อมสแกน');
        refreshUI();
        return;
      } catch (e) { lastErr = e; }
    }
    setStatus('<span style="color:#f87171">❌ โหลด AI Model ล้มเหลว: ' + (lastErr ? lastErr.message : '') + '</span>');
  }

  function startCamera() {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
      .then(stream => {
        video.srcObject = stream;
        cameraReady = true;
        refreshUI();
      })
      .catch(err => {
        setStatus('<span style="color:#f87171">❌ เปิดกล้องไม่ได้: ' + err.message + '</span>');
      });
  }

  function resetCaptures() {
    runId++;                       // ยกเลิกรอบสแกนที่ค้างอยู่
    busy = false;
    descriptors = [];
    failedUpload = false;
    guide.classList.remove('scanning');
    showArrow('');
    setGuide('', 'พร้อมสแกน');
    stepChip.textContent = '';
    showMsg('');
    refreshUI();
  }

  function onMainClick() {
    if (failedUpload) return uploadAll();
    return startScan();
  }

  // ----- สแกนอัตโนมัติ 3 มุม ในการกดครั้งเดียว -----
  async function startScan() {
    const name = nameInput.value.trim();
    if (!name) return alert('กรุณาใส่ชื่อก่อน');
    if (!modelsReady || !cameraReady) return;

    const run = ++runId;
    descriptors = [];
    failedUpload = false;
    busy = true;
    btnSave.disabled = true;
    btnSave.innerHTML = '⏳ กำลังสแกน...';
    nameInput.disabled = true;
    btnReset.style.display = 'block';
    showMsg('');
    guide.classList.add('scanning');
    refreshUI();

    for (let i = 0; i < TOTAL; i++) {
      const d = await captureStep(i, run);
      if (run !== runId) return;             // ถูกยกเลิก
      descriptors.push(d);
      doFlash();
      setGuide('ok', '✅ ' + STEPS[i].label + ' เรียบร้อย');
      showArrow('');
      refreshUI();
      await sleep(i < TOTAL - 1 ? 900 : 500);
      if (run !== runId) return;
    }

    guide.classList.remove('scanning');
    setGuide('done', '✅ สแกนครบ 3 มุม กำลังบันทึก...');
    await uploadAll();
  }

  // รอให้ผู้ใช้อยู่ในท่าที่ถูกต้อง นิ่งไว้ครู่หนึ่ง แล้วถ่ายอัตโนมัติ
  async function captureStep(i, run) {
    const cfg = STEPS[i];
    stepChip.textContent = 'มุมที่ ' + (i + 1) + '/' + TOTAL + ' • ' + cfg.label;
    showArrow(cfg.arrow);
    setGuide('adjust', cfg.hint);
    const t0 = Date.now();
    let good = 0;

    while (run === runId) {
      let res = null;
      try {
        res = await faceapi.detectSingleFace(video, detectorOpts()).withFaceLandmarks();
      } catch (e) { console.error(e); }
      if (run !== runId) return null;

      if (!res) {
        good = 0;
        setGuide('none', 'ไม่พบใบหน้า — กรุณาอยู่ในกรอบ');
      } else {
        const yaw = yawOf(res.landmarks.positions);
        const timedOut = Date.now() - t0 > STEP_TIMEOUT_MS;
        if (cfg.ok(yaw) || timedOut) {
          good++;
          setGuide('ok', 'นิ่งไว้ กำลังถ่าย...');
        } else {
          good = 0;
          setGuide('adjust', cfg.hint);
        }
        if (good >= STABLE_FRAMES) {
          let full = null;
          try {
            full = await faceapi.detectSingleFace(video, detectorOpts()).withFaceLandmarks().withFaceDescriptor();
          } catch (e) { console.error(e); }
          if (run !== runId) return null;
          if (full) return Array.from(full.descriptor, x => +x.toFixed(5));
          good = 0;
        }
      }
      await sleep(120);
    }
    return null;
  }

  async function uploadAll() {
    const name = nameInput.value.trim();
    busy = true;
    failedUpload = false;
    btnSave.disabled = true;
    btnSave.innerHTML = '⏳ กำลังบันทึก...';
    nameInput.disabled = true;
    btnReset.style.display = 'none';
    const run = runId;

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'registerUser', name, faceDescriptors: descriptors })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      busy = false;
      setGuide('done', '✅ บันทึกสำเร็จ');
      showMsg('<span class="msg-success">✅ ลงทะเบียน "' + name.replace(/[<>&]/g, '') + '" สำเร็จ (' + descriptors.length + ' มุม)</span>');
      btnSave.innerHTML = '✅ บันทึกแล้ว';
      // เตรียมลงทะเบียนคนถัดไป
      setTimeout(() => {
        if (run !== runId) return;
        descriptors = [];
        nameInput.value = '';
        setGuide('', 'พร้อมสแกน');
        stepChip.textContent = '';
        refreshUI();
      }, 2500);
    } catch (e) {
      busy = false;
      failedUpload = true;
      setGuide('none', 'บันทึกไม่สำเร็จ');
      showMsg('<span class="msg-error">❌ บันทึกล้มเหลว: ' + e.message + ' (ข้อมูลที่สแกนยังอยู่ กด "ส่งอีกครั้ง")</span>');
      refreshUI();
    }
  }
</script>
</body>
</html>
