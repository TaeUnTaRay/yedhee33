<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สแกนเข้างาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="js/api-config.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://justadudewhohacks.github.io">
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/plugin/buddhistEra.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/th.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/th.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #0f0f23 0%, #0d1b2a 60%, #0a0f1e 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 50px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      background: #10b981;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.08;
      bottom: -150px; right: -150px;
      pointer-events: none; z-index: 0;
    }

    .page-wrap {
      width: 100%; max-width: 560px;
      position: relative; z-index: 1;
      animation: fadeIn 0.5s ease;
      display: flex; flex-direction: column; align-items: center;
    }

    /* Header */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; margin-bottom: 16px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #64748b; text-decoration: none; font-size: 0.85em;
      padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.25s ease;
    }
    .back-btn:hover { color: #e2e8f0; background: rgba(255,255,255,0.1); }

    h2 {
      font-size: 1.1em; font-weight: 600; color: #c7d2fe;
    }
    .spacer { width: 80px; }

    /* Status Area */
    .status-area {
      width: 100%; text-align: center; margin-bottom: 14px;
    }
    #main-status {
      font-size: 0.9em; color: #94a3b8;
      min-height: 22px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #gps-status {
      font-size: 0.8em; color: #475569; margin-top: 6px;
      min-height: 18px;
    }
    .status-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 5px 12px; font-size: 0.82em;
    }
    .dot-pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: #10b981;
      animation: pulse 1.5s infinite;
    }

    /* GPS Alert */
    .gps-alert {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5;
      border-radius: 12px; padding: 12px 16px;
      width: 100%; margin-bottom: 12px;
      font-size: 0.88em; font-weight: 600;
      text-align: center;
    }

    /* Scanner Container */
    .video-container {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #060612;
      min-height: 280px;
    }

    video {
      width: 100%; height: auto; display: block;
      transform: scaleX(-1);
      opacity: 0;
      transition: opacity 0.5s ease;
      border-radius: 20px;
    }
    video.active { opacity: 1; }

    /* Scanner frame corners */
    .scanner-frame {
      position: absolute; inset: 0; z-index: 5; pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 28px; height: 28px;
      border-color: #10b981;
      border-style: solid;
      opacity: 0.8;
    }
    .corner-tl { top: 14px;    left: 14px;   border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .corner-tr { top: 14px;    right: 14px;  border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .corner-bl { bottom: 14px; left: 14px;   border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .corner-br { bottom: 14px; right: 14px;  border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* Scan line */
    .scan-line {
      display: none;
      position: absolute; left: 8%; right: 8%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #10b981, transparent);
      box-shadow: 0 0 8px rgba(16,185,129,0.8);
      z-index: 6;
      animation: scanMove 2s ease-in-out infinite;
    }
    .scan-line.active { display: block; }

    /* Overlay status badge */
    #overlay-status {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      color: #e2e8f0;
      padding: 6px 18px; border-radius: 30px;
      z-index: 10; white-space: nowrap; font-size: 0.84em;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Start Button */
    #btnStart {
      display: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white; border: none; border-radius: 50px;
      padding: 16px 44px; font-size: 18px; font-weight: 600;
      cursor: pointer; font-family: 'Sarabun', sans-serif;
      box-shadow: 0 4px 25px rgba(99,102,241,0.45);
      margin: 20px auto 0;
      transition: all 0.3s ease;
      animation: btnPulse 2s ease-in-out infinite;
    }
    #btnStart:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 35px rgba(99,102,241,0.6);
      animation: none;
    }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none; position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-content {
      background: linear-gradient(160deg, #1e1e3f 0%, #16213e 100%);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 32px 28px;
      border-radius: 24px;
      width: 88%; max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: flex; flex-direction: column; align-items: center;
      animation: modalSlideUp 0.35s ease;
    }
    .modal-avatar {
      font-size: 52px;
      background: rgba(99,102,241,0.15);
      border: 2px solid rgba(99,102,241,0.3);
      border-radius: 50%;
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 0.82em; color: #64748b; margin-bottom: 4px; }
    .user-name {
      font-size: 24px; color: #a5b4fc; font-weight: 700;
      margin-bottom: 12px;
    }
    .time-badge {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.3);
      color: #34d399;
      padding: 8px 22px; border-radius: 30px;
      font-size: 15px; font-weight: 600;
      margin-bottom: 6px;
    }
    .score-text { color: #475569; font-size: 13px; margin-bottom: 20px; }

    .btn {
      border: none; border-radius: 14px; cursor: pointer; width: 100%;
      margin: 5px 0; font-family: 'Sarabun', sans-serif;
      transition: all 0.25s ease;
    }
    .btn-confirm {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 17px; font-size: 20px; font-weight: 700;
      box-shadow: 0 4px 20px rgba(16,185,129,0.35);
      margin-bottom: 10px;
    }
    .btn-confirm:hover:not(:disabled) {
      box-shadow: 0 8px 30px rgba(16,185,129,0.5);
      transform: translateY(-1px);
    }
    .btn-confirm:disabled { background: rgba(255,255,255,0.08); color: #475569; box-shadow: none; }
    .btn-cancel {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
      padding: 12px; font-size: 15px; font-weight: 600;
    }
    .btn-cancel:hover { background: rgba(239,68,68,0.18); }

    .date-badge { font-size: 0.85em; color: #94a3b8; margin-bottom: 8px; }
    #actionBtns { width: 100%; display: flex; flex-direction: column; }
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 5px; }
    .action-row .btn { margin: 0; padding: 17px 8px; font-size: 19px; font-weight: 700; }
    .btn-out {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 4px 20px rgba(239,68,68,0.35);
    }
    .btn-out:hover:not(:disabled) { box-shadow: 0 8px 30px rgba(239,68,68,0.5); transform: translateY(-1px); }
    .shift-badge {
      display: inline-block; font-size: 0.85em; font-weight: 600;
      padding: 3px 12px; border-radius: 20px; margin-bottom: 8px;
      background: rgba(99,102,241,0.18); border: 1px solid rgba(99,102,241,0.4); color: #c7d2fe;
    }
    .shift-badge.night { background: rgba(30,41,59,0.8); border-color: rgba(148,163,184,0.5); color: #e2e8f0; }
    .btn-leave {
      background: rgba(245,158,11,0.15);
      border: 1px solid rgba(245,158,11,0.4);
      color: #fcd34d; padding: 13px; font-size: 16px; font-weight: 600;
    }
    .btn-leave:hover { background: rgba(245,158,11,0.25); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Leave modal */
    #leaveModal { z-index: 110; overflow-y: auto; padding: 16px 0; }
    #leaveModal .modal-content { max-width: 380px; padding: 22px 18px; }
    .leave-title { font-size: 1.1em; font-weight: 700; color: #fcd34d; margin-bottom: 2px; }
    .leave-who { font-size: 0.85em; color: #94a3b8; margin-bottom: 12px; }
    .kind-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 12px; }
    .kind-chip {
      padding: 10px 6px; border-radius: 12px; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: #cbd5e1;
      font-family: inherit; font-size: 0.9em; font-weight: 600;
    }
    .kind-chip.active { background: rgba(245,158,11,0.2); border-color: #f59e0b; color: #fcd34d; }
    .kind-chip.absent.active { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #fca5a5; }
    .leave-cal { margin-bottom: 8px; }
    .leave-cal .flatpickr-calendar { margin: 0 auto; box-shadow: none; }
    .leave-summary { font-size: 0.88em; color: #34d399; min-height: 20px; margin-bottom: 8px; }
    #leaveNote {
      width: 100%; padding: 11px 13px; margin-bottom: 8px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06);
      color: #e2e8f0; font-family: inherit; font-size: 0.95em; outline: none;
    }
    .btn-leave-submit {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff; padding: 14px; font-size: 17px; font-weight: 700;
    }

    /* Animations */
    @keyframes fadeIn      { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse       { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { box-shadow: 0 0 0 5px rgba(16,185,129,0); } }
    @keyframes btnPulse    { 0%,100% { box-shadow: 0 4px 25px rgba(99,102,241,0.45); } 50% { box-shadow: 0 4px 40px rgba(99,102,241,0.7); } }
    @keyframes scanMove    { 0% { top: 12%; } 50% { top: 82%; } 100% { top: 12%; } }
    @keyframes modalSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<div class="page-wrap">

  <div class="top-bar">
    <a href="index.html" class="back-btn">← กลับ</a>
    <h2>📷 สแกนเข้างาน</h2>
    <div class="spacer"></div>
  </div>

  <div class="status-area">
    <div id="main-status">⏳ กำลังเตรียมระบบ...</div>
    <div id="gps-status"></div>
  </div>

  <div id="gps-alert-box" class="gps-alert">
    ⚠️ คุณอยู่นอกพื้นที่ที่กำหนด!<br>กรุณาเข้าใกล้จุดเช็คอินแล้วรีเฟรชหน้าจอ
  </div>

  <div class="video-container">
    <div class="scanner-frame">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line" id="scanLine"></div>
    </div>
    <div id="overlay-status">รอโหลด...</div>
    <video id="video" autoplay muted playsinline></video>
  </div>

</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-avatar">🙋</div>
    <p class="modal-title">ตรวจพบบุคคล</p>
    <div class="user-name" id="modalName">...</div>
    <div id="modalDate" class="date-badge"></div>
    <div id="modalTime" class="time-badge">00:00</div>
    <div id="modalShift" class="shift-badge"></div>
    <div id="modalScore" class="score-text"></div>
    <div id="actionBtns">
      <div class="action-row">
        <button class="btn btn-confirm" id="btnConfirm" onclick="submitAttendance('เข้างาน')">✅ เข้างาน</button>
        <button class="btn btn-out" id="btnOut" onclick="submitAttendance('ออกงาน')">🚪 ออกงาน</button>
      </div>
      <button class="btn btn-leave" id="btnLeave" onclick="openLeave()">🏖️ ลา / ขาดงาน</button>
      <button class="btn btn-cancel" onclick="cancelAttendance()">ไม่ใช่ฉัน</button>
    </div>
  </div>
</div>

<!-- Leave Modal -->
<div id="leaveModal" class="modal-overlay">
  <div class="modal-content">
    <div class="leave-title">🏖️ แจ้งลา / ขาดงาน</div>
    <div class="leave-who" id="leaveWho"></div>
    <div class="kind-row" id="kindRow">
      <button type="button" class="kind-chip active" data-kind="ลาป่วย">🤒 ลาป่วย</button>
      <button type="button" class="kind-chip" data-kind="ลากิจ">📝 ลากิจ</button>
      <button type="button" class="kind-chip" data-kind="ลาพักร้อน">🌴 ลาพักร้อน</button>
      <button type="button" class="kind-chip absent" data-kind="ขาดงาน">❌ ขาดงาน</button>
    </div>
    <div class="leave-cal"><input type="text" id="leaveCalendar"></div>
    <div class="leave-summary" id="leaveSummary"></div>
    <input type="text" id="leaveNote" placeholder="หมายเหตุ (ไม่บังคับ)" maxlength="200">
    <button class="btn btn-leave-submit" id="btnLeaveSubmit" onclick="submitLeave()">บันทึก</button>
    <button class="btn btn-cancel" onclick="closeLeave()">ย้อนกลับ</button>
  </div>
</div>

<script>
  const API_URL        = localStorage.getItem('gasApiUrl') || GAS_API_URL;
  const video          = document.getElementById('video');
  const mainStatus     = document.getElementById('main-status');
  const overlayStatus  = document.getElementById('overlay-status');
  const confirmModal   = document.getElementById('confirmModal');
  const gpsStatus      = document.getElementById('gps-status');
  const gpsAlertBox    = document.getElementById('gps-alert-box');

  const MATCH_THRESHOLD = 0.45;

  let knownFaces   = [];
  let currentMatch = null;
  let currentLat   = null;
  let currentLng   = null;
  let shiftCfg     = { morningStart: 4, nightStart: 16 };   // อัปเดตจาก getConfig

  // ===== Init =====
  // ทำทุกอย่างพร้อมกัน (GPS / ตั้งค่า / โมเดล AI / ฐานข้อมูลใบหน้า / กล้อง) แล้วเริ่มสแกนอัตโนมัติเมื่อพร้อม
  const CFG_KEY   = 'gpsConfigCache_v1';
  const FACES_KEY = 'knownFacesCache_v1';
  const CACHE_MAX_AGE = 7 * 86400000;
  const MODEL_SOURCES = [
    'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights',
    'https://justadudewhohacks.github.io/face-api.js/models'
  ];

  const ready = { gps: false, camera: false, models: false, faces: false };
  let fatal = false, gpsBlocked = false, gpsPos = null, gpsConfig = null;
  let scanning = false, scanRun = 0, cameraStarting = false;

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function readCache(key) {
    try {
      const c = JSON.parse(localStorage.getItem(key));
      if (c && c.d && Date.now() - c.t < CACHE_MAX_AGE) return c.d;
    } catch (e) {}
    return null;
  }
  function writeCache(key, d) {
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {}
  }

  if (!API_URL) {
    showError('ยังไม่ได้ตั้งค่า API URL — <a href="config.html" style="color:#fbbf24">ไปตั้งค่า</a>');
  } else {
    window.addEventListener('load', init);
  }

  function init() {
    gpsConfig = readCache(CFG_KEY);                       // ใช้ค่าจากแคชก่อน แล้วโหลดใหม่เบื้องหลัง
    if (gpsConfig && gpsConfig.nightStart) shiftCfg = { morningStart: gpsConfig.morningStart, nightStart: gpsConfig.nightStart };
    renderProgress();
    startGps();
    loadConfig();
    loadModels();
    loadFaces();
    startCamera();
  }

  function canScan() {
    return ready.gps && ready.camera && ready.models && ready.faces && !gpsBlocked && !fatal && !currentMatch;
  }

  function renderProgress() {
    if (fatal || gpsBlocked || currentMatch || canScan()) return;
    const mk = (ok, label) => (ok ? '✅' : '⏳') + ' ' + label;
    mainStatus.innerHTML = [mk(ready.gps, 'GPS'), mk(ready.camera, 'กล้อง'), mk(ready.models, 'AI'), mk(ready.faces, 'ฐานข้อมูล')].join(' &nbsp; ');
    mainStatus.style.color = '#94a3b8';
  }

  function tryStart() {
    renderProgress();
    if (canScan() && !scanning) startScanLoop();
  }

  function fatalError(msg) {
    fatal = true;
    stopScan();
    stopCamera();
    showError(msg);
  }

  // ===== GPS =====
  function startGps() {
    if (!navigator.geolocation) return fatalError('Browser ไม่รองรับ GPS');
    navigator.geolocation.getCurrentPosition(
      pos => { gpsPos = pos.coords; evaluateGps(); },
      () => fatalError('กรุณาเปิด GPS (Location Service)'),
      { enableHighAccuracy: false, maximumAge: 120000, timeout: 15000 }   // ใช้ตำแหน่งล่าสุดได้ (เร็วขึ้น)
    );
  }

  async function loadConfig() {
    try {
      const c = await fetch(API_URL + '?action=getConfig').then(r => r.json());
      gpsConfig = c;
      writeCache(CFG_KEY, c);
      if (c.nightStart) shiftCfg = { morningStart: c.morningStart, nightStart: c.nightStart };
      evaluateGps();
    } catch (e) {
      if (!gpsConfig) fatalError('เชื่อมต่อ API ไม่ได้: ' + e.message);
    }
  }

  function evaluateGps() {
    if (!gpsPos || !gpsConfig) return;
    currentLat = gpsPos.latitude;
    currentLng = gpsPos.longitude;
    const c = gpsConfig;

    if (!c.lat || !c.lng || c.radius == 0) {
      gpsStatus.innerHTML = '<span style="color:#34d399">📍 GPS: ไม่จำกัดพื้นที่</span>';
      return setGpsOk(true);
    }
    const dist = haversineKm(currentLat, currentLng, c.lat, c.lng);
    if (dist <= c.radius) {
      gpsStatus.innerHTML = '<span style="color:#34d399">📍 GPS: OK (ห่างเป้าหมาย ' + dist.toFixed(3) + ' km)</span>';
      setGpsOk(true);
    } else {
      gpsStatus.innerHTML = '<span style="color:#f87171">📍 GPS: ห่างเกินไป (' + dist.toFixed(3) + ' km / กำหนด ' + c.radius + ' km)</span>';
      setGpsOk(false);
    }
  }

  function setGpsOk(ok) {
    ready.gps = ok;
    gpsBlocked = !ok;
    if (ok) {
      gpsAlertBox.style.display = 'none';
      if (!video.srcObject) startCamera();
      tryStart();
    } else {
      gpsAlertBox.style.display = 'block';
      mainStatus.innerText = '⛔ ไม่อนุญาตให้สแกน';
      overlayStatus.innerText = 'Out of Range';
      stopScan();
      stopCamera();
    }
  }

  // ===== Load AI (ใช้โมเดลตรวจจับใบหน้าแบบเล็ก โหลดเร็วและประมวลผลเร็วกว่า) =====
  async function loadModels() {
    let lastErr = null;
    for (const base of MODEL_SOURCES) {
      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(base),
          faceapi.nets.faceLandmark68Net.loadFromUri(base),
          faceapi.nets.faceRecognitionNet.loadFromUri(base)
        ]);
        ready.models = true;
        return tryStart();
      } catch (e) { lastErr = e; }
    }
    fatalError('โหลด AI Model ล้มเหลว: ' + (lastErr ? lastErr.message : ''));
  }

  // ===== Load DB (ใช้แคชในเครื่องให้สแกนได้ทันที แล้วอัปเดตจากเซิร์ฟเวอร์เบื้องหลัง) =====
  function applyFaces(list) {
    knownFaces = list.map(u => ({ name: u.label, descriptor: new Float32Array(u.descriptor) }));
  }

  async function loadFaces() {
    const cached = readCache(FACES_KEY);
    if (cached && cached.length) {
      applyFaces(cached);
      ready.faces = true;
      tryStart();
    }
    try {
      const data = await fetch(API_URL + '?action=getKnownFaces').then(r => r.json());
      if (!Array.isArray(data)) throw new Error((data && data.error) || 'ข้อมูลไม่ถูกต้อง');
      if (data.length === 0) {
        try { localStorage.removeItem(FACES_KEY); } catch (e) {}
        knownFaces = [];
        return fatalError('ไม่พบข้อมูลพนักงาน กรุณาลงทะเบียนก่อน');
      }
      applyFaces(data);
      writeCache(FACES_KEY, data);
      ready.faces = true;
      tryStart();
    } catch (e) {
      if (!ready.faces) fatalError('โหลดฐานข้อมูลล้มเหลว: ' + e.message);
    }
  }

  // ===== Camera =====
  function startCamera() {
    if (cameraStarting || video.srcObject) return;
    cameraStarting = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } })
      .then(stream => {
        cameraStarting = false;
        if (gpsBlocked || fatal) { stream.getTracks().forEach(t => t.stop()); return; }
        video.srcObject = stream;
        video.classList.add('active');
        ready.camera = true;
        tryStart();
      })
      .catch(err => {
        cameraStarting = false;
        fatalError('เปิดกล้องไม่ได้: ' + err.message);
      });
  }

  function stopCamera() {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
    video.classList.remove('active');
    ready.camera = false;
  }

  // ===== Scan Loop =====
  function startScanLoop() {
    if (scanning) return;
    scanning = true;
    const run = ++scanRun;
    mainStatus.innerText   = '✅ กำลังสแกน...';
    mainStatus.style.color = '#34d399';
    document.getElementById('scanLine').classList.add('active');
    overlayStatus.innerText        = 'มองกล้องเพื่อสแกน';
    overlayStatus.style.background = 'rgba(0,0,0,0.65)';
    scanLoop(run);
  }

  function stopScan() {
    scanning = false;
    scanRun++;
    document.getElementById('scanLine').classList.remove('active');
  }

  async function scanLoop(run) {
    const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 });
    while (run === scanRun) {
      if (video.readyState >= 2 && !video.paused && !video.ended) {
        let detection = null;
        try {
          detection = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
        } catch (e) { console.error(e); }
        if (run !== scanRun) return;

        if (detection) {
          const best = findBestMatch(detection.descriptor);
          if (best.distance < MATCH_THRESHOLD) {
            scanning = false;
            document.getElementById('scanLine').classList.remove('active');
            showModal(best);
            return;
          }
          overlayStatus.innerText        = 'ไม่รู้จัก (' + best.distance.toFixed(2) + ')';
          overlayStatus.style.background = 'rgba(239,68,68,0.6)';
        } else {
          overlayStatus.innerText        = 'มองกล้องเพื่อสแกน';
          overlayStatus.style.background = 'rgba(0,0,0,0.65)';
        }
      }
      await sleep(120);
    }
  }

  function findBestMatch(queryDesc) {
    let best = { name: 'unknown', distance: 1.0 };
    knownFaces.forEach(u => {
      const d = faceapi.euclideanDistance(queryDesc, u.descriptor);
      if (d < best.distance) best = { name: u.name, distance: d };
    });
    return best;
  }

  // ===== Date & Time (Day.js) =====
  dayjs.extend(dayjs_plugin_buddhistEra);
  dayjs.locale('th');
  let clockTimer = null;

  // ===== Modal =====
  function showModal(match) {
    currentMatch = match.name;
    document.getElementById('modalName').innerText = match.name;

    const tick = () => {
      const now = dayjs();
      document.getElementById('modalDate').innerText = now.format('dddd D MMMM BBBB');
      document.getElementById('modalTime').innerText = 'เวลา ' + now.format('HH:mm:ss') + ' น.';
      const h = now.hour() + now.minute() / 60;
      const isDay = h >= shiftCfg.morningStart && h < shiftCfg.nightStart;
      const sb = document.getElementById('modalShift');
      sb.innerText = isDay ? '☀️ กะเช้า' : '🌙 กะดึก';
      sb.className = 'shift-badge' + (isDay ? '' : ' night');
    };
    tick();
    clearInterval(clockTimer);
    clockTimer = setInterval(tick, 1000);

    const pct = ((1 - match.distance) * 100).toFixed(1);
    document.getElementById('modalScore').innerText = 'ความเหมือน: ' + pct + '%';

    document.querySelectorAll('#actionBtns button').forEach(b => b.disabled = false);
    confirmModal.style.display = 'flex';
    mainStatus.innerText = 'กรุณาเลือกรายการ...';
  }

  async function postApi(payload) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  // status = 'เข้างาน' | 'ออกงาน'
  async function submitAttendance(status) {
    const buttons = document.querySelectorAll('#actionBtns button');
    const btn = document.getElementById(status === 'ออกงาน' ? 'btnOut' : 'btnConfirm');
    const oldText = btn.innerText;
    buttons.forEach(b => b.disabled = true);
    btn.innerText = 'กำลังบันทึก...';

    try {
      const data = await postApi({
        action: 'logAttendance', name: currentMatch,
        lat: currentLat, lng: currentLng, status: status
      });
      alert('✅ ' + (data.message || 'บันทึกสำเร็จ'));
      window.location.href = 'index.html';
    } catch (e) {
      alert('❌ ' + e.message);
      buttons.forEach(b => b.disabled = false);
      btn.innerText = oldText;
    }
  }

  // ===== Leave / Absent =====
  let leavePicker = null;
  let leaveKind = 'ลาป่วย';

  function openLeave() {
    document.getElementById('leaveWho').innerText = 'พนักงาน: ' + currentMatch;
    document.getElementById('leaveNote').value = '';

    if (!leavePicker) {
      leavePicker = flatpickr('#leaveCalendar', {
        inline: true, mode: 'range', locale: 'th',
        dateFormat: 'Y-m-d', defaultDate: [new Date()],
        onChange: updateLeaveSummary
      });
      document.getElementById('kindRow').addEventListener('click', e => {
        const chip = e.target.closest('.kind-chip');
        if (!chip) return;
        leaveKind = chip.dataset.kind;
        document.querySelectorAll('.kind-chip').forEach(c => c.classList.toggle('active', c === chip));
        updateLeaveSummary();
      });
    } else {
      leavePicker.setDate([new Date()], true);
    }
    updateLeaveSummary();
    document.getElementById('leaveModal').style.display = 'flex';
  }

  function closeLeave() {
    document.getElementById('leaveModal').style.display = 'none';
  }

  function getLeaveDates() {
    const sel = leavePicker ? leavePicker.selectedDates : [];
    if (!sel.length) return [];
    const start = dayjs(sel[0]).startOf('day');
    const end   = dayjs(sel[sel.length - 1]).startOf('day');
    const out = [];
    for (let d = start; !d.isAfter(end); d = d.add(1, 'day')) out.push(d.format('YYYY-MM-DD'));
    return out;
  }

  function updateLeaveSummary() {
    const dates = getLeaveDates();
    const el = document.getElementById('leaveSummary');
    if (!dates.length) { el.innerText = 'กรุณาเลือกวันที่'; return; }
    const first = dayjs(dates[0]).format('D MMM BB');
    const last  = dayjs(dates[dates.length - 1]).format('D MMM BB');
    el.innerText = leaveKind + ' ' + dates.length + ' วัน (' +
                   (dates.length > 1 ? first + ' – ' + last : first) + ')';
    el.style.color = dates.length > 31 ? '#f87171' : '#34d399';
  }

  async function submitLeave() {
    const dates = getLeaveDates();
    if (!dates.length) return alert('กรุณาเลือกวันที่');
    if (dates.length > 31) return alert('เลือกได้ไม่เกิน 31 วันต่อครั้ง');
    if (!confirm('ยืนยัน ' + leaveKind + ' ' + dates.length + ' วัน ?')) return;

    const btn = document.getElementById('btnLeaveSubmit');
    btn.disabled = true;
    btn.innerText = 'กำลังบันทึก...';
    try {
      const data = await postApi({
        action: 'logLeave', name: currentMatch, dates: dates,
        kind: leaveKind, note: document.getElementById('leaveNote').value.trim()
      });
      alert('✅ ' + (data.message || 'บันทึกสำเร็จ'));
      window.location.href = 'index.html';
    } catch (e) {
      alert('❌ ' + e.message);
      btn.disabled = false;
      btn.innerText = 'บันทึก';
    }
  }

  function cancelAttendance() {
    clearInterval(clockTimer);
    closeLeave();
    confirmModal.style.display = 'none';
    currentMatch = null;
    mainStatus.innerText   = '✅ กำลังสแกน...';
    mainStatus.style.color = '#34d399';
    // กลับไปสแกนต่อทันที (หน่วงเล็กน้อยกันจับซ้ำคนเดิม)
    setTimeout(() => { if (canScan()) startScanLoop(); }, 1500);
  }

  // ===== Helpers =====
  function showError(msg) {
    mainStatus.innerHTML = '<span style="color:#f87171">❌ ' + msg + '</span>';
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R    = 6371;
    const dLat = deg2rad(lat2 - lat1);
    const dLon = deg2rad(lon2 - lon1);
    const a = Math.sin(dLat/2) ** 2 +
              Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function deg2rad(deg) { return deg * Math.PI / 180; }
</script>
